[versions]
agp = "9.5.0"
# Matches the Kotlin compiler embedded in AGP's built-in Kotlin support.
kotlin = "2.2.10"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# material-icons-core is upstream-FROZEN at 1.7.8 (the compose BOM no longer carries a
# real mapping for it, so the versionless entry used to hide which artifact actually
# resolved). Pinned explicitly so a future BOM change can never silently break or move it.
# Policy: use the core set only; NEVER add icons-extended (same freeze, ~10x bloat).
# Glyphs outside the core set come in as Material Symbols SVG imports (drawables).
materialIconsCore = "1.7.8"
coroutines = "1.11.0"
navigation3 = "1.2.0"
koin = "4.2.2"
paging = "3.5.3"
junit = "4.13.2"
room = "2.8.5"
ksp = "2.2.10-2.0.2" # first segment must match the Kotlin compiler pinned by AGP
datastore = "1.3.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
# 1.12.x carries Kotlin 2.4 metadata — unreadable by AGP 9.5's pinned Kotlin 2.2 compiler.
kotlinxSerializationJson = "1.11.0"
robolectric = "4.17"
turbine = "1.2.1"
# Roborazzi runtime only: its Gradle plugin (through 1.44.0-alpha03) looks up AGP's
# removed TestedExtension and cannot apply on AGP 9.x, so screenshots are recorded by
# the plain JVM test task via captureRoboImage.
roborazzi = "1.44.0-alpha03"
# Runtime libs may move independently of the broken Gradle plugin; plugin stays pinned
# above until it supports AGP 9.x.
roborazziRuntime = "1.77.0"
# Trial only (keep-or-drop decided after the run). 1.0.5 is the first and only line
# with KSP2/Kotlin 2.x support; <1.0.5 crashes under KSP2 (NoSuchMethodError via
# Room 2.7 xprocessing). design-previews-00 research.
showkase = "1.0.5"
# Ticket 16: Firebase backend (the only com.google.* imports live in :backend:firebase)
# plus the Android-side Google Credential Manager that feeds it ID tokens.
googleServices = "4.5.0"
firebaseBom = "34.18.0"
credentials = "1.5.0"
googleId = "1.1.1"
# Backend-firebase unit tests: FirebaseUser has a package-private constructor, so the
# auth tests mock the SDK type instead of hand-rolling a fake.
mockito = "5.20.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIconsCore" }
androidx-compose-material3-windowsizeclass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerializationJson" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazziRuntime" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazziRuntime" }
showkase = { group = "com.airbnb.android", name = "showkase", version.ref = "showkase" }
showkase-annotation = { group = "com.airbnb.android", name = "showkase-annotation", version.ref = "showkase" }
showkase-processor = { group = "com.airbnb.android", name = "showkase-processor", version.ref = "showkase" }
# Ticket 16: main modules (not -ktx) per the Firebase BoM guidance.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: pure-Kotlin modules (A16: core/game, games/zip) apply org.jetbrains.kotlin.jvm
# VERSION-LESS — AGP 9's built-in Kotlin already carries the plugin on the classpath,
# and requesting it with a version fails resolution. Same embedded compiler as Android.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
# Ticket 16: processes the root google-services.json into app resources (FirebaseInitProvider).
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
