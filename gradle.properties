org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# WHY: KSP (Room compiler) is not yet AGP built-in-Kotlin aware; it must add its
# generated Kotlin dirs via kotlin.sourceSets, which AGP otherwise rejects.
android.disallowKotlinSourceSets=false
# Reuse task outputs between runs (main writes the CI cache, PRs read it), run independent
# modules in parallel, and skip re-configuring an unchanged build.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
