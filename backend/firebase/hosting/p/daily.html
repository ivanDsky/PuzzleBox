<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PuzzleBox daily puzzle</title>
<meta property="og:title" content="A PuzzleBox daily puzzle">
<meta property="og:description" content="Open this link on a phone with PuzzleBox to play it.">
<meta property="og:type" content="website">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --fg: #222;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --fg: #f0ece4;
      --muted: #a49e93;
    }
  }
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; text-align: center;
         background: var(--bg); color: var(--fg); }
  main { padding: 24px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
  #date { font-size: 2rem; font-weight: 700; margin: 16px 0; }
  #date:empty { display: none; }
  .steps { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--fg); }
  body.invalid #date { display: none; }
  .invalid-message { display: none; }
  body.invalid .invalid-message { display: block; }
</style>
</head>
<body>
<main>
  <h1 id="heading">A PuzzleBox daily puzzle</h1>
  <p id="date"></p>
  <p class="invalid-message">This link doesn't contain a valid PuzzleBox daily puzzle</p>
  <p class="steps">Open this link on a phone with PuzzleBox to play it</p>
  <p><a href="https://github.com/ivanDsky/PuzzleBox/releases/latest" target="_blank" rel="noopener">Get PuzzleBox</a></p>
</main>
<noscript>
  <p>Open this link on a phone with PuzzleBox to play it</p>
</noscript>
<script type="module" src="/p/daily.js"></script>
</body>
</html>
