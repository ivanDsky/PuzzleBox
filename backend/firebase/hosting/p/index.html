<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PuzzleBox puzzle</title>
<meta property="og:title" content="A PuzzleBox puzzle from a friend">
<meta property="og:description" content="Open PuzzleBox and enter the code to play.">
<meta property="og:type" content="website">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; text-align: center; background: #faf7f2; color: #222; }
  main { padding: 24px; }
  #code { font-size: 3rem; font-weight: 700; letter-spacing: 0.12em; margin: 16px 0; font-family: ui-monospace, monospace; }
  #code:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>A PuzzleBox puzzle from a friend</h1>
  <p id="code"></p>
  <p>Open PuzzleBox &rarr; Play &rarr; From friends &rarr; Enter a code</p>
</main>
<script>
  (function () {
    var raw = location.pathname.replace(/^\/p\//, "").replace(/[^0-9A-Za-z]/g, "").toUpperCase();
    if (raw.length !== 6) return;
    document.getElementById("code").textContent = raw.slice(0, 3) + "-" + raw.slice(3);
  })();
</script>
</body>
</html>
