# The one CI workflow (ADR-0023): PRs run no CI and merge without a status check. Every push to
# main runs the unit tests (two parallel jobs) beside the signed release build. Only when all of
# them are green does `publish` release the APK as GitHub release v<versionName>. A versionName
# that already has a tag publishes nothing. A red run means main is broken: fix forward or revert.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One queue for push and dispatch runs, so releases publish in order; a running publish is never
# cancelled halfway. GitHub keeps one pending run per group: a third quick merge replaces the
# second's pending run, and the next run releases HEAD.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # `assembleDebug` also runs checkModuleGraph (ADR-0008) via preBuild. `testCore` and `testUi`
  # together are `test`: the JVM modules, every Android module's debug unit tests, :app's release
  # host tests (ReleaseGameModulesTest, ReleaseUpdateChecksTest, ReleaseFlagsBindingTest) and
  # :konsist (ADR-0009). Screenshot classes are review renders, not tests: the default run skips
  # them and nothing compares pixels (ADR-0033). :app's NativeGraphicsWarmUpTest keeps the
  # Robolectric native runtime from aborting the test JVM now that no golden warms it up
  # (ADR-0023).
  test:
    # A dispatch from another branch would publish unmerged code as the latest release.
    if: github.ref == 'refs/heads/main'
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tasks: assembleDebug testCore
          - shard: ui
            tasks: testUi
    env:
      # Robolectric's Android runtime jars (android-all-instrumented) for every SDK the tests run on,
      # as Robolectric 4.17 names them: 32 and 34 come from `@Config(sdk = …)`, 37 is targetSdk, the
      # default. Robolectric looks for them in ~/.m2/repository and downloads a missing one from
      # Maven Central in the middle of a test run. A Robolectric bump or a test on a new SDK changes
      # this list; the "Check Robolectric runtime list" step names the jar to add.
      ROBOLECTRIC_ANDROID_ALL: >-
        12.1-robolectric-8229987-i7
        14-robolectric-10818077-i7
        17-robolectric-15733970-i7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Runs on the default branch only, so setup-gradle writes the Gradle cache here.
      - uses: gradle/actions/setup-gradle@v6

      # A failed test-time download of a runtime jar took down 110 to 303 tests in 4 of 20 red main
      # runs (ADR-0023). The jars come from this cache instead. On a miss the prefetch step fetches
      # them with retries and checks their SHA-512, so a failed download fails that one step before
      # any test runs. The save step follows the prefetch, so a red test step still keeps the jars.
      - name: Restore Robolectric runtime
        id: robolectric-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-${{ env.ROBOLECTRIC_ANDROID_ALL }}

      - name: Prefetch Robolectric runtime
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        run: |
          repo=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented
          for version in $ROBOLECTRIC_ANDROID_ALL; do
            dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$version"
            mkdir -p "$dir"
            for file in "android-all-instrumented-$version.pom" "android-all-instrumented-$version.jar"; do
              for name in "$file" "$file.sha512"; do
                curl --fail --silent --show-error --location --connect-timeout 30 --speed-limit 1024 --speed-time 60 \
                  --retry 5 --retry-all-errors --retry-delay 15 \
                  --output "$dir/$name" "$repo/$version/$name"
              done
              echo "$(cat "$dir/$file.sha512")  $dir/$file" | sha512sum --check --strict
            done
          done

      # Both shards miss together on a new key; the second save only logs that the key exists.
      - name: Save Robolectric runtime
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}

      - name: Build and unit tests
        run: ./gradlew ${{ matrix.tasks }} --continue

      # A jar the list lacks was downloaded at test time, the failure mode the cache removes. Red
      # here is a stale list, not a broken test: add the named jar to ROBOLECTRIC_ANDROID_ALL.
      - name: Check Robolectric runtime list
        if: success() || failure()
        run: |
          extra=$(comm -13 <(tr ' ' '\n' <<< "$ROBOLECTRIC_ANDROID_ALL" | sort) \
            <(find "$HOME/.m2/repository/org/robolectric/android-all-instrumented" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort))
          if [ -n "$extra" ]; then
            echo "::error::Robolectric downloaded ${extra//$'\n'/ } at test time; add it to ROBOLECTRIC_ANDROID_ALL in release.yml"
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.shard }}
          path: "**/build/reports/tests/"
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit "$missing"

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PagentVersionCode=$((1000 + GITHUB_RUN_NUMBER)) \
            -Ppuzzlebox.signing.storeFile="$RUNNER_TEMP/release.jks" \
            -Ppuzzlebox.signing.storePassword="$RELEASE_STORE_PASSWORD" \
            -Ppuzzlebox.signing.keyAlias="$RELEASE_KEY_ALIAS" \
            -Ppuzzlebox.signing.keyPassword="$RELEASE_KEY_PASSWORD"

      - name: Verify signer
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/apksigner"
          echo "Using $apksigner"
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          # Signer labels vary by build-tools: "Signer #1" (36), "V2 Signer:" (37), "Signer (minSdkVersion=…)".
          # Every signer must be the release key; the source-stamp signer is not an app signer.
          actual=$(printf '%s\n' "$certs" | sed -n '/^Source Stamp/d; s/^.*Signer[^:]*:\{0,1\} certificate SHA-256 digest: //p' \
            | tr -d ': ' | tr '[:upper:]' '[:lower:]' | sort -u)
          expected=$(echo "$RELEASE_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK signer SHA-256 '$actual' is not the release key's '$expected'"
            exit 1
          fi

      - name: Read version
        id: version
        run: |
          version=$(jq -r '.elements[0].versionName // empty' app/build/outputs/apk/release/output-metadata.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version already released — bump versionName to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK
        if: steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # A red test shard skips this job, so a broken main never ships a release.
  publish:
    needs: [test, release]
    if: needs.release.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          apk="PuzzleBox-$VERSION.apk"
          mv app-release.apk "$apk"
          notes="Download $apk under Assets and open it; allow installs from your browser if Android asks."
          # Only the first release replaces debug-key builds, which cannot update in place.
          if [ "$(gh release list --limit 1 --json tagName --jq length)" = 0 ]; then
            notes="$notes Uninstall any earlier PuzzleBox build first."
          fi
          gh release create "v$VERSION" "$apk" \
            --target "$GITHUB_SHA" \
            --title "PuzzleBox $VERSION" \
            --latest \
            --generate-notes \
            --notes "$notes"
          echo "Published [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)." >> "$GITHUB_STEP_SUMMARY"
