# The required PR check for trunk-based delivery (PROFILE `changes: trunk`): every PR into main
# must build the debug APK and pass every module's unit tests before it can merge. Runs on main
# too, so a red main shows up on the merge commit and the next PR is its revert.
name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's running check; main runs are never cancelled.
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection on main requires this job's name as the status check.
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache; PRs read it, so a PR can never poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `assembleDebug` also runs checkModuleGraph (ADR-0008) via preBuild. `test` covers the
      # JVM modules, every Android module's debug unit tests, :app's release host tests
      # (ReleaseGameModulesTest, ReleaseUpdateChecksTest) and :konsist (ADR-0009).
      # Screenshot goldens are recorded on macOS: Linux fonts drift, so pixels are not
      # verified here (roborazzi stays in record mode, and goldens.pixelCompare=false makes
      # the Tango harness skip its always-on pixel diff); verify them locally with
      # -Proborazzi.verify=true.
      - name: Build and unit tests
        run: ./gradlew assembleDebug test --continue -Pgoldens.pixelCompare=false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
